name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2

      # goreleaser's rust builder is cargo zigbuild, and it installs neither
      # zig nor cargo-zigbuild itself.
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1

      - name: install cargo-zigbuild
        env:
          VERSION: v0.23.4
        run: |
          set -euo pipefail
          base=https://github.com/rust-cross/cargo-zigbuild/releases/download/$VERSION
          a=cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz
          curl -fsSL -o "$a" "$base/$a"
          curl -fsSL -o "$a.sha256" "$base/$a.sha256"
          echo "$(awk '{print $1}' "$a.sha256")  $a" | sha256sum -c -
          tar -C "$HOME/.cargo/bin" --strip-components=1 -xf "$a"

      - uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
