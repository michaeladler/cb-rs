name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          # cargo-zigbuild lazily runs `rustup component add rust-src` per build
          # target. goreleaser builds in parallel, so two targets race the same
          # download and one dies on a missing `.partial` file.
          components: rust-src
          target: |
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            aarch64-apple-darwin

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: goreleaser
        shell: devenv shell --profile release -- bash -e {0}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            goreleaser release --clean
          else
            goreleaser release --clean --snapshot --skip=publish,sign
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot dist
        if: "!startsWith(github.event.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-snapshot
          path: dist/
          retention-days: 1
