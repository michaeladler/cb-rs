name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2

      # goreleaser's rust builder is cargo zigbuild, and it installs neither
      # zig nor cargo-zigbuild itself.
      - uses: xyzzylabs/setup-zig@ab632f9cc6f98d89d3b8f2c2e1577a929d0e70f3 # v1.0.4

      - name: install cargo-zigbuild
        env:
          VERSION: v0.23.4
        run: |
          set -euo pipefail
          base=https://github.com/rust-cross/cargo-zigbuild/releases/download/$VERSION
          a=cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz
          curl -fsSL -o "$a" "$base/$a"
          curl -fsSL -o "$a.sha256" "$base/$a.sha256"
          echo "$(awk '{print $1}' "$a.sha256")  $a" | sha256sum -c -
          tar -C "$HOME/.cargo/bin" --strip-components=1 -xf "$a"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
