name: bench

# Weekly, plus on demand. The numbers in README.md are a snapshot; this keeps a
# fresh one published without putting a 20-minute benchmark on every push.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: repetitions per row
        default: '5'
  schedule:
    - cron: '17 4 * * 1'

# Pushing the gh-pages branch needs write; nothing else does.
permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2

      # cb 0.10.0 is the baseline: the same release the README numbers come from.
      # The zip is the upstream binary with its libs laid out for RUNPATH
      # $ORIGIN, so the whole tree is extracted rather than just bin/cb.
      - name: install cb 0.10.0 and filesystem tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs
          # libasound2 is t64 on 24.04 and unsuffixed before it.
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          mkdir -p "$RUNNER_TEMP/cb"
          gh release download 0.10.0 -R Slackadays/Clipboard \
            -p clipboard-linux-amd64.zip -D "$RUNNER_TEMP/cb"
          unzip -qo "$RUNNER_TEMP/cb/clipboard-linux-amd64.zip" -d "$RUNNER_TEMP/cb"
          echo "$RUNNER_TEMP/cb/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cb/lib" >> "$GITHUB_ENV"

      # The local rows are tmpfs -> tmpfs. 8 GiB holds the retention section,
      # where cb materialises the holes of five 512 MiB copies (2.6 GB).
      - name: mount the tmpfs the local rows need
        run: |
          mkdir -p "$HOME/bench"
          sudo mount -t tmpfs -o size=8G tmpfs "$HOME/bench"

      - run: cargo build --release

      - name: mount the btrfs volume
        run: scripts/testvol.sh btrfs

      - name: bench
        run: |
          set -o pipefail
          scripts/bench.py "${{ github.event.inputs.reps || '5' }}" 2>&1 | tee bench.log

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: bench-log
          path: bench.log

      # One HTML page plus the raw log, published from a scratch repo rather than
      # a branch of this checkout: gh-pages holds the site and nothing else, and
      # an unrelated history each run means no fetch, no orphan dance, no
      # clobbering the working tree.
      - name: publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPS: ${{ github.event.inputs.reps || '5' }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          export site
          mkdir -p "$site"
          cp bench.log "$site/"
          scripts/benchhtml.py bench.log "$site/index.html"
          cd "$site"
          git init -q -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -qm "bench: ${GITHUB_SHA:0:12}"
          # Force: every run's history starts from scratch, so nothing here is a
          # descendant of the last run's commit.
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -qf origin gh-pages
