name: bench

# Weekly, plus on demand. The numbers in README.md are a snapshot; this keeps a
# fresh one published without putting a 20-minute benchmark on every push.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: repetitions per row
        default: "5"
  schedule:
    - cron: "17 4 * * 1"

# Pushing the gh-pages branch needs write; nothing else does.
permissions:
  contents: write

jobs:
  # One run per CoW filesystem: the copy ladder reaches FICLONE by a different
  # kernel path on each, and the rows are only comparable within one run.
  bench:
    strategy:
      fail-fast: false
      matrix:
        fs: [btrfs, xfs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2

      # cb 0.10.0 is the baseline: the same release the README numbers come from.
      # The zip is the upstream binary with its libs laid out for RUNPATH
      # $ORIGIN, so the whole tree is extracted rather than just bin/cb.
      - name: install cb 0.10.0 and filesystem tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs xfsprogs
          # libasound2 is t64 on 24.04 and unsuffixed before it.
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          mkdir -p "$RUNNER_TEMP/cb"
          gh release download 0.10.0 -R Slackadays/Clipboard \
            -p clipboard-linux-amd64.zip -D "$RUNNER_TEMP/cb"
          unzip -qo "$RUNNER_TEMP/cb/clipboard-linux-amd64.zip" -d "$RUNNER_TEMP/cb"
          echo "$RUNNER_TEMP/cb/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cb/lib" >> "$GITHUB_ENV"

      # $HOME/bench is deliberately left on the runner's own filesystem: no
      # tmpfs is mounted over it. ext4 is the only common filesystem that is
      # both a real device and without FICLONE, so the local rows are a plain
      # same-fs copy -- a tmpfs WORK would measure a memcpy, and a btrfs or xfs
      # WORK would make the local big row a reflink row without saying so.
      # bench.py reads the filesystem back for the banner and refuses to start
      # without room for the retention row, so nothing else is set up here.
      - run: cargo build --release

      - name: mount the ${{ matrix.fs }} volume
        run: scripts/testvol.sh "${{ matrix.fs }}"

      - name: bench
        env:
          CB_BENCH_VOL: ${{ github.workspace }}/mount-${{ matrix.fs }}
        run: |
          set -o pipefail
          scripts/bench.py "${{ github.event.inputs.reps || '5' }}" 2>&1 \
            | tee "bench-${{ matrix.fs }}.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ matrix.fs }}
          path: bench-${{ matrix.fs }}.log

  # One page per run plus an index, published from a scratch repo rather than a
  # branch of this checkout: gh-pages holds the site and nothing else, and an
  # unrelated history each run means no fetch, no orphan dance, no clobbering
  # the working tree. One job, not one per matrix leg: two jobs pushing the same
  # branch race, and the loser loses the run's numbers.
  publish:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: logs

      - name: publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPS: ${{ github.event.inputs.reps || '5' }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          export site
          mkdir -p "$site"
          cp logs/*/*.log "$site/"
          vol=()
          for log in "$site"/bench-*.log; do
            fs=$(basename "$log" .log)
            scripts/benchhtml.py "$log" "$site/$fs.html"
            vol+=("${fs#bench-}")
          done
          scripts/benchhtml.py --index "$site/index.html" "${vol[@]}"
          cd "$site"
          git init -q -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -qm "bench: ${GITHUB_SHA:0:12}"
          # Force: every run's history starts from scratch, so nothing here is a
          # descendant of the last run's commit.
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -qf origin gh-pages
